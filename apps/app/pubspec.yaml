name: poker_latino
description: "Poker Latino - cliente multijugador en Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game/
    - assets/game/avatars/
    - assets/game/avatars/personajes/
    - assets/game/ui/
    - assets/game/ui/icons/
    - assets/game/ui/rooms/
    - assets/game/sounds/
